<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projecte 1 ITAlumni - SignUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="signup-page">
    <div class="signup-card">
      <h1>Crea un compte</h1>
      <p class="subtitle">Uneix-te a nosaltres per connectar-te i compartir oportunitats!</p>

      <form class="signup-form">
        <div class="input-group">
          <span class="icon">&#128100;</span>
          <input type="text" placeholder="Posa el teu nom" required>
        </div>
        <div class="input-group">
          <span class="icon">&#128100;</span>
          <input type="text" placeholder="Posa el teu cognom" required>
        </div>
        <div class="input-group">
          <span class="icon">&#9993;</span>
          <input type="email" placeholder="El teu correu electrònic" required>
        </div>
        <div class="input-group">
          <span class="icon">&#128274;</span>
          <input type="password" placeholder="Crea una contrasenya" required>
        </div>

        <label class="terms">
          <input type="checkbox" required>
          Accepto els Termes i Condicions
        </label>

        <button type="submit" class="btn btn-solid btn-block">Registra't</button>
      </form>

      <div class="divider">o</div>

      <div class="social-buttons">
        <button type="button" class="btn btn-block btn-social btn-apple" disabled>Continua amb Apple</button>
        <button type="button" class="btn btn-block btn-social btn-google">Continua amb Google</button>
        <button type="button" class="btn btn-block btn-social btn-facebook">Continua amb Facebook</button>
      </div>

      <p class="footer-text">Ja t'has registrat? <a href="login.html">Inicia sessió</a></p>
    </div>
  </div>
</body>
</html>
